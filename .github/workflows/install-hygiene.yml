# Daily zero-warning-install watch on the PUBLISHED package.
#
# The published tarball ships no lockfile, so even with exact-pinned direct
# dependencies the registry can drift under us after a release: a transitive
# dependency gets deprecated (npm prints the deprecation on every user
# install), a platform-specific optional package (@vscode/ripgrep-*) changes,
# or a new npm version alters behavior. None of that touches a file in this
# repo, so no PR or release gate can catch it — only re-verifying the real
# `npm install -g @twigpine/openclaude@latest` against the live registry does.
#
# The OS matrix matters: each platform resolves a different ripgrep optional
# package, so a Linux-only check is blind to what macOS/Windows users install.
name: Install hygiene

on:
  pull_request:
  schedule:
    - cron: '17 6 * * *' # daily, off the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale runs for the same pull request. Scheduled and manual runs
# get a per-run group and are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      install: ${{ steps.filter.outputs.install }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        with:
          filters: |
            install:
              - 'package.json'
              - 'bun.lock'
              - 'src/utils/imageResizer.native.test.ts'
              - '.github/workflows/install-hygiene.yml'

  verify-published-install:
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.install == 'true' }}
    name: ${{ matrix.os }} / Node ${{ matrix.node-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ["24.22.1", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify native image processing
        run: bun test src/utils/imageResizer.native.test.ts

      - name: Verify published package installs clean
        run: bun run scripts/verify-clean-install.ts --published

  required:
    name: Install hygiene required
    if: ${{ always() }}
    needs: [changes, verify-published-install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify applicable checks passed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node <<'NODE'
          const jobs = JSON.parse(process.env.JOB_RESULTS);
          const selected = process.env.EVENT_NAME === 'pull_request' ? jobs.changes.outputs.install : 'true';
          const expected = selected === 'true' ? 'success' : 'skipped';
          if (jobs.changes.result !== 'success' || !['true', 'false'].includes(selected) || jobs['verify-published-install'].result !== expected) {
            console.error('Change detection must succeed and applicable checks must pass.', jobs);
            process.exit(1);
          }
          console.log('Applicable checks passed; untouched surfaces were skipped.');
          NODE
